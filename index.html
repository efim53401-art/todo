<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todo:// — мои задачи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="app__titles">
        <h1>Мои задачи</h1>
        <p class="app__date" id="date"></p>
      </div>
      <button class="sound" id="soundToggle" type="button" aria-pressed="true" title="Переключить звук">Звук вкл.</button>
    </header>

    <form class="composer" id="form">
      <input
        id="input"
        type="text"
        placeholder="Добавить задачу…"
        autocomplete="off"
        maxlength="200"
        aria-label="Новая задача"
      >
      <button type="submit">Добавить</button>
    </form>

    <section class="toolbar">
      <div class="filters">
        <button class="filter is-active" type="button" data-filter="all">Все</button>
        <button class="filter" type="button" data-filter="active">Активные</button>
        <button class="filter" type="button" data-filter="done">Готовые</button>
      </div>
      <button class="clear" id="clearDone" type="button">Удалить готовые</button>
    </section>

    <ul class="list" id="list"></ul>

    <p class="empty" id="empty">Пока пусто — добавьте первую задачу</p>

    <footer class="footer">
      <span id="counter">0 задач</span>
      <button id="clearAll" type="button">Удалить все</button>
    </footer>
  </main>

  <div class="modal" id="confirmModal" hidden>
    <div class="modal__backdrop" data-action="cancel"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Удалить все задачи?</h2>
      <p>Вы уверены? Это удалит все задачи без возможности восстановления.</p>
      <div class="modal__actions">
        <button class="btn-ghost" type="button" data-action="cancel">Отмена</button>
        <button class="btn-danger" type="button" data-action="confirm">Удалить все</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
